<div class="full-screen-container">
    <div class="table-filter">
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="dataSource.applyFilter($event)" placeholder="Filter" #input>
        </mat-form-field>
    </div>

    <div class="main-content no-overflow">
        @if (dataSource.isLoading) {
        <div class="loading-overlay">
            <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        </div>
        }
        <div class="overflow">
            <table mat-table [dataSource]="dataSource" matSort>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                    <td mat-cell *matCellDef="let row"> {{row.id}} </td>
                </ng-container>

                <ng-container matColumnDef="title">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
                    <td mat-cell *matCellDef="let row"> {{row.title}} </td>
                </ng-container>

                <ng-container matColumnDef="created_at">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Created at </th>
                    <td mat-cell *matCellDef="let row"> {{row.created_at}} </td>
                </ng-container>

                <ng-container matColumnDef="updated_at">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Updated at </th>
                    <td mat-cell *matCellDef="let row"> {{row.updated_at}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button color="primary" matTooltip="Preview">
                            <mat-icon>preview</mat-icon>
                        </button>
                        <button mat-icon-button color="primary" (click)="editRow(row); $event.stopPropagation();"
                            matTooltip="Edit">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteRow(row); $event.stopPropagation();"
                            matTooltip="Delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" [routerLink]="['/markdowns',row.id]"
                    class="clickable">
                </tr>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
        </div>
        <button mat-fab color="primary" [routerLink]="['/markdowns', '__NEW__']">
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <app-navigation-bar></app-navigation-bar>
</div>
