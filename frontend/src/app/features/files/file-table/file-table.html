<div class="full-screen-container">
    <div class="table-filter">
        <mat-form-field>
            <mat-label>Filter</mat-label>
            <input matInput (keyup)="dataSource.applyFilter($event)" placeholder="Filter" #input>
        </mat-form-field>
    </div>

    <div class="main-content no-overflow">
        @if (dataSource.isLoading) {
        <div class="loading-overlay">
            <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        </div>
        }
        <div class="overflow">
            <table mat-table [dataSource]="dataSource" matSort>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>

                <ng-container matColumnDef="filename">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Original Filename </th>
                    <td mat-cell *matCellDef="let row"> {{row.metadata?.filename || '-'}} </td>
                </ng-container>

                <ng-container matColumnDef="content_type">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Content Type </th>
                    <td mat-cell *matCellDef="let row"> {{row.metadata?.content_type || '-'}} </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button color="primary" (click)="downloadFile(row); $event.stopPropagation();"
                            matTooltip="Download">
                            <mat-icon>download</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteRow(row); $event.stopPropagation();"
                            matTooltip="Delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;">
                </tr>
            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
        </div>

        <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none" />
        <button mat-fab color="primary" (click)="triggerUpload()" matTooltip="Upload file">
            <mat-icon>upload</mat-icon>
        </button>
    </div>

    <app-navigation-bar></app-navigation-bar>
</div>
